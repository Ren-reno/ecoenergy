<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}EcoEnergy Monitor{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#1f6f4a;">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="{% url 'monitor:listado' %}">⚡ EcoEnergy Monitor</a>
            <a class="btn btn-outline-light btn-sm" href="{% url 'monitor:listado' %}">Ver zonas</a>
        </div>
    </nav>

    <main class="container my-4">
        {% block contenido %}
        {% endblock %}
    </main>

    <footer class="text-center text-muted small my-4">
        EcoEnergy · Panel interno de monitoreo energetico
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
